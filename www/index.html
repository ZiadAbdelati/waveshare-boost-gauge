<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Boost Gauge 0.2.4</title>
<style>
:root{--bg:#0b0d10;--card:#151920;--text:#e8ecf2;--muted:#6b7280;--teal:#2ee6c5;--amber:#ffb020;--flare:#ff3b30;--line:#2a303a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;letter-spacing:.04em}
header .ver{color:var(--muted);font-size:12px}
main{padding:0 12px 24px;max-width:520px;margin:0 auto;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gauge-wrap{display:flex;justify-content:center}
canvas{width:240px;height:240px;max-width:100%}
.big{font-size:40px;font-weight:700}
.zone{font-size:12px;letter-spacing:.16em;color:var(--teal)}
.muted{color:var(--muted)}
button,select{
  background:#1e2430;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font:inherit;width:100%
}
button.primary{background:linear-gradient(180deg,#2a3344,#1c2330)}
button.half, .half{flex:1;min-width:0}
input[type=range]{width:100%}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.time-row{display:flex;gap:8px}
.time-row > div{flex:1;min-width:0}
.hm{display:flex;gap:6px}
.hm select{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#1a1f28;cursor:pointer;width:auto}
.chip.active{border-color:var(--amber);color:var(--amber)}
.foot{font-size:12px;color:var(--muted);padding:2px}
.ok{color:var(--teal)}.bad{color:var(--flare)}
.check{display:flex;gap:8px;align-items:center;width:auto}
</style>
</head>
<body>
<header>
  <h1>BOOST GAUGE</h1>
  <div class="ver" id="ver">…</div>
</header>
<main>
  <section class="card">
    <h2>Live</h2>
    <div class="gauge-wrap"><canvas id="cv" width="300" height="300"></canvas></div>
    <div style="text-align:center">
      <div class="zone" id="zone">ATMO</div>
      <div class="big" id="psi">+0.0</div>
      <div class="muted">PSI · peak <span id="peak">+0.0</span></div>
      <div class="muted" id="uiDbg" style="margin-top:4px;font-size:11px"></div>
    </div>
  </section>

  <section class="card">
    <h2>Brightness</h2>
    <label>Level <span id="brv">100</span>%</label>
    <input id="br" type="range" min="0" max="100" value="100"/>
    <div class="row" style="margin-top:10px">
      <button class="primary half" id="brToggle">Toggle Max/Min</button>
      <button class="half" id="peakReset">Reset Peak</button>
    </div>
  </section>

  <section class="card">
    <h2>Theme</h2>
    <div class="chips" id="themes"></div>
  </section>

  <section class="card">
    <h2>Time &amp; Auto-Dim</h2>
    <div class="row">
      <button class="primary" id="syncTime">Sync Time From This Device</button>
    </div>
    <div class="muted" id="timeLbl" style="margin-top:8px">—</div>
    <div style="margin-top:12px"><label class="check"><input type="checkbox" id="dimEn"/> Enable schedule</label></div>
    <div class="time-row" style="margin-top:10px">
      <div>
        <label>Dim start</label>
        <div class="hm">
          <select id="sh"></select>
          <select id="sm"></select>
        </div>
      </div>
      <div>
        <label>Dim end</label>
        <div class="hm">
          <select id="eh"></select>
          <select id="em"></select>
        </div>
      </div>
    </div>
    <button style="margin-top:10px" id="saveDim">Save Schedule</button>
  </section>

  <section class="card">
    <h2>OTA Update</h2>
    <p class="muted" style="margin:0 0 8px">Upload app <code>.bin</code>. Device reboots on success.</p>
    <input id="fw" type="file" accept=".bin,application/octet-stream"/>
    <button class="primary" style="margin-top:10px" id="otaBtn">Flash Firmware</button>
    <div class="foot" id="otaStatus"></div>
  </section>

  <section class="card">
    <h2>GIF</h2>
    <p class="muted" style="margin:0">Not implemented yet. No microSD required later (SPIFFS).</p>
  </section>

  <div class="foot" id="foot">Connecting…</div>
</main>
<script>
const $ = id => document.getElementById(id);
const cv=$('cv');
const ctx=cv.getContext('2d');
async function api(path){
  const r=await fetch(path,{cache:'no-store'});
  const text=await r.text();
  if(!r.ok) throw new Error(text || `HTTP ${r.status}`);
  try{return JSON.parse(text);}catch(_){return {};}
}
let state = {psi:0,peak:0,zone:'ATMO',brightness:100,theme:0};
let controlsHydrated=false;
let pollBusy=false;
function fillSelect(sel, max, step=1){
  sel.innerHTML='';
  for(let i=0;i<=max;i+=step){
    const o=document.createElement('option');
    o.value=String(i); o.textContent=String(i).padStart(2,'0');
    sel.appendChild(o);
  }
}
fillSelect($('sh'),23); fillSelect($('eh'),23);
fillSelect($('sm'),59,1); fillSelect($('em'),59,1);
$('sh').value='21'; $('sm').value='0'; $('eh').value='7'; $('em').value='0';

function colorFor(psi){
  if(psi>=18) return '#ff3b30';
  if(psi>=0.35) return '#ffb020';
  if(psi>-0.35) return '#e8ecf2';
  return '#2ee6c5';
}
function drawGauge(){
  const w=cv.width,h=cv.height,cx=w/2,cy=h/2;
  const face=state.theme===1?'#1a1d24':'#000';
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=face; ctx.beginPath(); ctx.arc(cx,cy,w/2,0,Math.PI*2); ctx.fill();
  const r=w*0.42,lw=w*0.08,start=135*Math.PI/180,span=270*Math.PI/180;
  ctx.strokeStyle='#3a3f4a'; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,cy,r,start,start+span); ctx.stroke();
  const psi=Math.max(-15,Math.min(25,state.psi));
  const t=(psi+15)/40, zeroT=15/40, a0=start+zeroT*span, a1=start+t*span;
  ctx.strokeStyle=colorFor(psi); ctx.beginPath();
  if(psi>=0) ctx.arc(cx,cy,r,a0+0.04,a1); else ctx.arc(cx,cy,r,a1,a0-0.04);
  ctx.stroke();
  const zx=Math.cos(a0), zy=Math.sin(a0);
  ctx.strokeStyle='#e8ecf2'; ctx.lineWidth=lw*0.45;
  ctx.beginPath();
  ctx.moveTo(cx+(r-lw*0.55)*zx, cy+(r-lw*0.55)*zy);
  ctx.lineTo(cx+(r+lw*0.55)*zx, cy+(r+lw*0.55)*zy);
  ctx.stroke();
}
function apply(j, hydrateControls=false){
  if(j.psi!=null) state.psi=j.psi;
  if(j.peak!=null) state.peak=j.peak;
  if(j.zone) state.zone=j.zone;
  if(j.brightness!=null){
    state.brightness=j.brightness;
    if(hydrateControls){
      $('br').value=j.brightness;
      $('brv').textContent=j.brightness;
    }
  }
  if(j.theme_id!=null){ state.theme=j.theme_id; highlight(); }
  $('psi').textContent=(state.psi>=0?'+':'')+Number(state.psi).toFixed(1);
  $('peak').textContent=(state.peak>=0?'+':'')+Number(state.peak).toFixed(1);
  $('zone').textContent=state.zone; $('zone').style.color=colorFor(state.psi);
  if(j.version) $('ver').textContent=j.version;
  $('uiDbg').textContent = `device ui_psi=${Number(j.ui_psi??0).toFixed(1)} ready=${j.ui_ready??'?'}`;
  drawGauge();
}
function highlight(){
  document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('active', Number(el.dataset.id)===Number(state.theme)));
}
async function refresh(hydrateControls=false){
  const j = await api('/api/status');
  if(j.dim && (hydrateControls || !controlsHydrated)){
    $('dimEn').checked=!!j.dim.enable;
    $('sh').value=String(j.dim.start_hour??21);
    $('sm').value=String(j.dim.start_min??0);
    $('eh').value=String(j.dim.end_hour??7);
    $('em').value=String(j.dim.end_min??0);
  }
  if(j.time_epoch){
    $('timeLbl').textContent = j.time_epoch < 100000 ? 'not set' : new Date(j.time_epoch*1000).toLocaleString();
  }
  apply(j, hydrateControls);
  if(hydrateControls) controlsHydrated=true;
  $('foot').innerHTML = `SSID <span class="ok">${j.ssid||'—'}</span> · heap ${j.free_heap??'—'} · up ${j.uptime_s??0}s`;
}
async function loadThemes(){
  const j=await api('/api/themes');
  const box=$('themes'); box.innerHTML='';
  (j.themes||[]).forEach(t=>{
    const el=document.createElement('button');
    el.type='button';
    el.className='chip'; el.dataset.id=t.id; el.textContent=t.name;
    el.addEventListener('click',async()=>{
      el.disabled=true;
      try{
        const j=await api('/api/theme?id='+t.id);
        apply(j,false);
      }catch(e){ alert(e.message); }
      finally{ el.disabled=false; }
    });
    box.appendChild(el);
  });
  highlight();
}

let brTimer=0;
async function setBrightness(pct){
  try{
    const j=await api('/api/brightness?percent='+pct);
    apply(j,false);
  }catch(e){ alert(e.message); }
}
$('br').oninput=()=>{
  const pct=$('br').value;
  $('brv').textContent=pct;
  clearTimeout(brTimer);
  brTimer=setTimeout(()=>setBrightness(pct),120);
};
$('br').onchange=()=>{
  clearTimeout(brTimer);
  setBrightness($('br').value);
};
$('brToggle').onclick=async()=>{ try{ const j=await api('/api/brightness?toggle=1'); apply(j,true); }catch(e){alert(e.message);} };
$('peakReset').onclick=async()=>{ try{ await api('/api/peak/reset'); }catch(e){alert(e.message);} };
$('syncTime').onclick=async()=>{
  const epoch=Math.floor(Date.now()/1000);
  const tz=-new Date().getTimezoneOffset();
  try{ await api(`/api/time?epoch=${epoch}&tz_offset_min=${tz}`); await refresh(false); }catch(e){alert(e.message);}
};
$('dimEn').onchange=()=>{};
['sh','sm','eh','em'].forEach(id=>$(id).onchange=()=>{});
$('saveDim').onclick=async()=>{
  const q=new URLSearchParams({
    dim_enable:$('dimEn').checked?'1':'0',
    dim_start_hour:$('sh').value, dim_start_min:$('sm').value,
    dim_end_hour:$('eh').value, dim_end_min:$('em').value
  });
  try{
    await api('/api/config?'+q.toString());
    $('otaStatus').textContent='Schedule saved';
  }catch(e){alert(e.message);}
};
$('otaBtn').onclick=async()=>{
  const f=$('fw').files[0]; if(!f){ $('otaStatus').textContent='Choose a .bin'; return; }
  $('otaStatus').textContent='Uploading…';
  const fd=new FormData(); fd.append('firmware', f);
  try{ const r=await fetch('/api/ota',{method:'POST',body:fd}); $('otaStatus').textContent=await r.text(); }
  catch(e){ $('otaStatus').textContent='Upload finished / rebooting'; }
};

// Poll status instead of SSE — much more reliable on SoftAP + mobile Safari.
async function loop(){
  if(pollBusy) return;
  pollBusy=true;
  try{ await refresh(false); }
  catch(e){ $('foot').innerHTML=`<span class="bad">Offline</span> ${e.message}`; }
  finally{
    pollBusy=false;
    setTimeout(loop,500);
  }
}
api('/api/ping')
  .then(loadThemes)
  .then(()=>refresh(true))
  .then(()=>setTimeout(loop,500))
  .catch(e=>{
    $('foot').innerHTML=`<span class="bad">Cannot reach API</span> — ${e.message}`;
  });
</script>
</body>
</html>
